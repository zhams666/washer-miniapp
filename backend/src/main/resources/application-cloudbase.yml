server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${WASHER_PG_URL}
    username: ${WASHER_PG_USERNAME}
    password: ${WASHER_PG_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.washer.backend: info

washer:
  database-type: postgresql
