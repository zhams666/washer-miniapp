server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  level:
    com.washer.backend: info

cloudbase:
  pg:
    env-id: ${CLOUDBASE_ENV_ID:${TCB_ENV_ID:}}
    api-key: ${CLOUDBASE_API_KEY:${CLOUDBASE_APIKEY:${TCB_API_KEY:}}}

# Timeout completion currently relies on SQL row locks; keep it off until its RPC replacement is deployed.
washer:
  scheduling:
    enabled: false
