server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: washer-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${WASHER_DB_URL:jdbc:mysql://127.0.0.1:3306/washer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${WASHER_DB_USERNAME:root}
    password: ${WASHER_DB_PASSWORD}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.washer.backend: info

wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID:wxb83ca5cce97b3680}
    secret: ${WECHAT_MINIAPP_SECRET:}
    base-url: ${WECHAT_MINIAPP_BASE_URL:https://api.weixin.qq.com}
    mock-login-enabled: ${WECHAT_MINIAPP_MOCK_LOGIN_ENABLED:false}
  pay:
    enabled: ${WECHAT_PAY_ENABLED:false}
    app-id: ${WECHAT_PAY_APP_ID:${WECHAT_MINIAPP_APP_ID:}}
    mch-id: ${WECHAT_PAY_MCH_ID:}
    merchant-serial-no: ${WECHAT_PAY_MCH_SERIAL_NO:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    platform-certificate-path: ${WECHAT_PAY_PLATFORM_CERTIFICATE_PATH:}
    base-url: ${WECHAT_PAY_BASE_URL:https://api.mch.weixin.qq.com}

washer:
  # simulated: 本地仅记录设备状态；provider: 调用设备厂商 HTTP 接口。
  device:
    mode: ${WASHER_DEVICE_MODE:simulated}
    vendor: ${WASHER_DEVICE_VENDOR:unconfigured}
    base-url: ${WASHER_DEVICE_BASE_URL:}
    start-path: ${WASHER_DEVICE_START_PATH:/devices/{deviceCode}/start}
    stop-path: ${WASHER_DEVICE_STOP_PATH:/devices/{deviceCode}/stop}
    api-key-header: ${WASHER_DEVICE_API_KEY_HEADER:X-Api-Key}
    api-key: ${WASHER_DEVICE_API_KEY:}
    success-field: ${WASHER_DEVICE_SUCCESS_FIELD:code}
    success-value: ${WASHER_DEVICE_SUCCESS_VALUE:0}
  # simulation 仅用于本地卡券和券码联调；provider 模式等待支付/券平台适配器接入。
  commerce:
    mode: ${WASHER_COMMERCE_MODE:provider}
    provider-name: ${WASHER_COMMERCE_PROVIDER:unconfigured}
  point-mall:
    fulfillment-mode: ${WASHER_POINT_MALL_FULFILLMENT_MODE:simulation}
